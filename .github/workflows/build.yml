name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            wget libffi-dev libssl-dev \
            autoconf automake libtool pkg-config autotools-dev libltdl-dev \
            libncurses5-dev libncursesw5-dev \
            zip unzip openjdk-17-jdk

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade buildozer cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix git config and clean buildozer
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android clean || true

      - name: Pre-install Android SDK
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          cd $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          buildozer -v android debug
        timeout-minutes: 50

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niko-app-apk
          path: bin/*.apk
          if-no-files-found: warn
