name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git wget unzip openjdk-17-jdk
          pip install --upgrade buildozer cython virtualenv

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug
        timeout-minutes: 55

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niko-app-apk
          path: bin/*.apk
          if-no-files-found: warn
